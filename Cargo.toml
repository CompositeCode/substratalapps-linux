[workspace]
resolver = "3"
members = ["crates/substratal-core", "crates/substratal-hub", "crates/substratalctl", "crates/xtask"]
default-members = ["crates/substratal-core", "crates/substratal-hub", "crates/substratalctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CompositeCode/substratalapps-linux"
rust-version = "1.85"

[workspace.dependencies]
substratal-core = { path = "crates/substratal-core", default-features = false }
substratalctl = { path = "crates/substratalctl", default-features = false }
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive", "env"] }
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
