# Versioned build + deploy of the help center (docs/) to GitHub Pages.
#
# Runs on every push to main that changes the app, the docs, the vendored
# API spec or the spec-derived data, so the published help always matches
# main. Generated reference pages are rebuilt from the code first
# (cargo xtask gen-docs), then the site is built and versioned exactly like
# the Platform API's docs: patch bump by default, [docs:minor] or
# [docs:major] in a commit subject for more. Each version's frozen snapshot
# goes to the docs-versions branch and is served at /versions/<version>/.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/**"
      - "data/**"
      - "vendor/**"
      - "scripts/docs-build.rb"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push snapshots to docs-versions
  pages: write
  id-token: write

# One release at a time, never cancelled midway: each run reads the archive
# the previous run wrote, so overlapping runs would race on version numbers.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # bump markers are read from every commit since the last version

      # The generator only needs the GTK-free crates (core and the CLI).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate reference pages from the code
        run: cargo xtask gen-docs

      - name: Check out version archive
        run: |
          if git ls-remote --exit-code --heads origin docs-versions >/dev/null; then
            git fetch --depth=1 origin +docs-versions:refs/remotes/origin/docs-versions
            git worktree add _archive -B docs-versions origin/docs-versions
          else
            echo "No docs-versions branch yet; starting the archive at 1.0.0."
            git worktree add --orphan -b docs-versions _archive
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs

      - name: Pick version bump
        id: bump
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump="${INPUT_BUMP:-patch}"
          last=$(ruby -ryaml -e 'm = File.exist?("_archive/manifest.yml") ? YAML.load_file("_archive/manifest.yml") : nil
            v = ((m || {})["versions"] || []).first
            print v ? v["commit"].to_s : ""')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            msgs=$(git log --format=%s "$last..HEAD")
          else
            msgs=$(git log -1 --format=%s)
          fi
          if grep -q '\[docs:major\]' <<<"$msgs"; then bump=major
          elif [ "$bump" != major ] && grep -q '\[docs:minor\]' <<<"$msgs"; then bump=minor; fi
          echo "level=$bump" >> "$GITHUB_OUTPUT"

      - name: Build versioned site
        id: build
        run: |
          ruby scripts/docs-build.rb \
            --archive _archive \
            --out _site \
            --bump "${{ steps.bump.outputs.level }}" \
            --commit "$GITHUB_SHA" \
            --summary "$(git log -1 --format=%s)"

      - name: Commit snapshot to docs-versions
        working-directory: _archive
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if [ ! -f README.md ]; then
            cat > README.md <<'README'
          # docs-versions

          Archive of every released version of the help center, written by
          `.github/workflows/docs.yml` on `main`. Don't edit by hand.

          - `manifest.yml`: every version, newest first.
          - `<version>/`: that version's frozen static build, served at
            https://compositecode.github.io/substratalapps-linux/versions/<version>/
          README
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Archive docs v$VERSION from ${GITHUB_SHA::7}"
          git push origin docs-versions

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
