# Build, lint and test the app; check that spec-derived files and the
# Linux help pages match their sources.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build and test (Ubuntu 24.04, GTK 4.14, libadwaita 1.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK, libadwaita and Blueprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev blueprint-compiler libdbus-1-dev \
            desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Desktop and AppStream files are valid
        run: |
          desktop-file-validate data/com.substratalapps.Hub.desktop
          appstreamcli validate --no-net data/com.substratalapps.Hub.metainfo.xml

  specs:
    name: Spec-derived files match the specs package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: CompositeCode/substratalapps-applications-specs
          path: _specs
      - name: Check (warns only; the Specs sync workflow opens the update PR)
        run: python3 scripts/sync-specs.py --specs _specs --check || echo "::warning::Specs package has changed since the last sync; see the Specs sync workflow."
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux help pages generate (warns when the help center needs an update)
        run: |
          if [ -d _specs/help/guides ]; then
            cargo xtask gen-help --out _specs/help --check || echo "::warning::The Linux pages in the help center differ from this code; the Docs dispatch workflow updates them after merge."
          fi

