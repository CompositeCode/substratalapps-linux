# Keeps the Linux app's pages in the Hub help center current.
#
# The help center lives in the specs repo
# (CompositeCode/substratalapps-applications-specs, help/) and is the one
# documentation site for every Hub app. On every push to main that changes
# the app, this:
#   1. regenerates the pages that come from this app's code
#      (`cargo xtask gen-help`: Linux keyboard shortcuts, substratalctl),
#   2. opens or updates a pull request in the specs repo when they changed,
#   3. sends `app-docs-updated` so the help center rebuilds.
#
# Needs the secret SPECS_DOCS_TOKEN: a fine-grained token with Contents and
# Pull requests read/write on the specs repo (see help/README.md there).
# Without it, the run regenerates and reports, and skips steps 2 and 3.
name: Docs dispatch

on:
  push:
    branches: [main]
    paths: ["crates/**", ".github/workflows/docs-dispatch.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-dispatch
  cancel-in-progress: false

env:
  SPECS_REPO: CompositeCode/substratalapps-applications-specs
  HAS_TOKEN: ${{ secrets.SPECS_DOCS_TOKEN != '' }}

jobs:
  help:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out the help center
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SPECS_REPO }}
          path: _specs
          token: ${{ secrets.SPECS_DOCS_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the Linux help pages
        id: gen
        run: |
          if [ ! -d _specs/help/guides ]; then
            echo "::notice::The specs repo's default branch has no help/ yet; nothing to update."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask gen-help --out _specs/help
          echo "ready=true" >> "$GITHUB_OUTPUT"
          git -C _specs status --short
      - name: Open a pull request in the specs repo
        if: steps.gen.outputs.ready == 'true' && env.HAS_TOKEN == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SPECS_DOCS_TOKEN }}
          path: _specs
          branch: automation/linux-help
          delete-branch: true
          commit-message: "Update the Linux help pages from substratalapps-linux@${{ github.sha }}"
          title: "Update the Linux help pages"
          body: |
            Regenerated by `cargo xtask gen-help` in CompositeCode/substratalapps-linux at ${{ github.sha }}: the Linux keyboard shortcuts and the `substratalctl` reference.
      - name: Tell the help center to rebuild
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPECS_DOCS_TOKEN }}
        run: |
          gh api "repos/$SPECS_REPO/dispatches" -f event_type=app-docs-updated \
            -F 'client_payload[app]=linux' -F "client_payload[sha]=$GITHUB_SHA"
      - name: No token
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::SPECS_DOCS_TOKEN isn't set, so no PR or dispatch was sent to $SPECS_REPO."
