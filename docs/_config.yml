title: Substratal Hub Help
description: >-
  Help center for the Substratal Hub apps (Linux, macOS, Windows, iOS/iPadOS,
  Android and Web): guides, tutorials, FAQs, a page for every screen, and the
  versioned Platform API reference.

# Project page on the default github.io URL. If a custom domain is added
# later (for example help.substratalapps.com), update both of these, add a
# CNAME file, and change HELP_BASE in crates/substratal-core/src/config.rs.
url: "https://compositecode.github.io"
baseurl: "/substratalapps-linux"

permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: substratal
logo: "/assets/images/mark.svg"
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  tokenizer_separator: /[\s/-]+/
  rel_url: true
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Platform API spec": "https://compositecode.github.io/substratalapps.com/"
  "GitHub": "https://github.com/CompositeCode/substratalapps-linux"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/CompositeCode/substratalapps-linux"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: red
  tip:
    title: Tip
    color: green

footer_content: >-
  Substratal Hub help center. Reference pages are generated from the app's
  code, the client specs and the Platform API's openapi.yaml on every change.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
