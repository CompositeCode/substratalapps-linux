[package]
name = "substratal-hub"
description = "Substratal Hub for Linux (GNOME): GTK 4 + libadwaita client of the Substratal Apps Platform API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "substratal-hub"
path = "src/main.rs"

[dependencies]
substratal-core.workspace = true
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
glib-build-tools = "0.22"
