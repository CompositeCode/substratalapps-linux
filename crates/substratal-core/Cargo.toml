[package]
name = "substratal-core"
description = "Platform-independent core of the Substratal Hub for Linux: API client, session, Capabilities, screen registry and navigation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["keyring"]
# Secret Service (GNOME Keyring / KWallet, or the Secret portal inside Flatpak).
# Off in environments with no session bus, such as CI containers.
keyring = ["dep:oo7"]

[dependencies]
httpdate.workspace = true
oo7 = { version = "0.6", optional = true, default-features = false, features = ["tokio", "native_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde_json.workspace = true
url.workspace = true
